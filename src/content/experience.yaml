        es: Lideré de forma independiente la iniciativa técnica para integrar un nuevo proveedor de actividades, transformar su modelo de datos al de la compañía y llevar la integración a producción.

- id: fluxit
  company: Flux IT
  location: { en: 'Hybrid · Buenos Aires, Argentina', es: 'Híbrido · Buenos Aires, Argentina' }
  start: '2011'
  end: '2018'
  order: 3
  summary:
    en: Progressed from SOA support and technical leadership into software architecture and senior team leadership, combining hands-on Java development with architecture definition, technical quality, and team coaching across different projects.
    es: Pasé de soporte SOA y liderazgo técnico a arquitectura de software y liderazgo senior de equipos, combinando desarrollo Java hands-on con definición de arquitectura, calidad técnica y coaching en distintos proyectos.
  roles:
    - { title: Senior Technical Team Lead, start: '2017', end: '2018' }
    - { title: Software Architect, start: '2015', end: '2017' }
    - { title: Technical Leader, start: '2011', end: '2014' }
    - { title: SOA Support, start: '2011', end: '2011' }
  highlights:
    - label: { en: Port operations platform, es: Plataforma de operaciones portuarias }
      text:
        en: Traveled to Buenaventura, Colombia, for two weeks to kick off a one-year project for a seaport web application integrated with Navis N4, a Terminal Operating System. Finalized scope, use cases, business rules, and operational restrictions with local stakeholders, then led the development team through the full lifecycle to production.
        es: Viajé dos semanas a Buenaventura, Colombia, para iniciar un proyecto de un año, una aplicación web para un puerto integrada con Navis N4, un Terminal Operating System. Cerré alcance, casos de uso, reglas de negocio y restricciones operativas con los stakeholders locales, y después lideré al equipo de desarrollo durante todo el ciclo hasta producción.
    - label: { en: HMO application support, es: Soporte de aplicaciones para una prepaga }
      text:
        en: Led technical work for a production support help desk serving Argentina’s largest private health maintenance organization, maintaining about 15 Java applications built with Java 6, Spring, Struts, DB2, SQL Server, and JBoss.
        es: Lideré el trabajo técnico de una mesa de soporte productivo para la prepaga privada más grande de Argentina, manteniendo unas 15 aplicaciones Java construidas con Java 6, Spring, Struts, DB2, SQL Server y JBoss.
    - label: { en: Middleware and BPM, es: Middleware y BPM }
      text:
        en: On the same organization’s middleware team, maintained and extended an enterprise service bus built with ServiceMix and Apache Camel, as well as a custom BPM engine similar to jBPM.
        es: En el equipo de middleware de la misma organización, mantuve y extendí un enterprise service bus construido con ServiceMix y Apache Camel, y un motor BPM propio similar a jBPM.
    - text:
        en: Provided architecture consulting, technical training, knowledge transfer, design support, and production troubleshooting across distributed Java applications and enterprise integrations.
        es: Brindé consultoría de arquitectura, capacitación técnica, transferencia de conocimiento, soporte de diseño y troubleshooting en producción en aplicaciones Java distribuidas e integraciones empresariales.

