  highlights:
    - label: { en: Cars, es: Autos }
      text:
        en: Integrated third-party APIs so customers could rent cars and purchase car insurance, in a large-scale travel technology environment.
        es: Integré APIs de terceros para que los clientes pudieran alquilar autos y contratar seguros, en un entorno de tecnología de viajes a gran escala.
    - label: { en: Destination Activities, es: Actividades en destino }
