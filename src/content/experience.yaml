- id: itx
  company: ITX Corp.
  location: { en: Remote, es: Remoto }
  start: '2019'
  end: null
  order: 1
  summary:
    en: Progressed from senior Java engineering into technical leadership and solution architecture, expanding scope from hands-on delivery to architecture definition, team enablement, and AI-enabled engineering transformation.
    es: Pasé de ingeniería Java senior a liderazgo técnico y arquitectura de soluciones, ampliando el alcance desde la entrega hands-on hacia la definición de arquitectura, la habilitación de equipos y la transformación de la ingeniería con IA.
  roles:
    - { title: Solutions Architect, start: '2023-06', end: null }
    - { title: Solution Lead, start: '2020-02', end: '2023-08' }
    - { title: Senior Java Software Engineer, start: '2019-03', end: '2020-02' }
  highlights:
    - label: { en: Architecture, es: Arquitectura }
      text:
        en: Architect for three teams in a Fortune 500 client’s benefits and retirement ecosystem. I define architectural approaches through wikis, component diagrams, critical-path documents, feasibility analysis, and proof-of-concept implementations.
        es: Arquitecto de tres equipos en el ecosistema de beneficios y retiro de un cliente Fortune 500. Defino enfoques de arquitectura mediante wikis, diagramas de componentes, documentos de camino crítico, análisis de factibilidad y pruebas de concepto.
    - label: { en: AI-enabled engineering, es: Ingeniería con IA }
      text:
        en: Lead training and adoption of Spec-driven Development, MCP integrations, AgentOS practices, and GitHub Copilot workflows across three architecture teams, helping teams use AI to produce architectural guidance, diagrams, documentation, and working prototypes.
        es: Lidero la capacitación y adopción de Spec-driven Development, integraciones MCP, prácticas de AgentOS y flujos con GitHub Copilot en tres equipos de arquitectura, ayudando a usar IA para generar guías de arquitectura, diagramas, documentación y prototipos funcionales.
    - label: { en: Payments and retirement, es: Pagos y retiro }
      text:
        en: Led teams working on retirement plans and a critical payment-rail ecosystem processing payments worth millions of dollars daily. Technical escalation point for solutions spanning microservices, relational and non-relational databases, headless processes, and multiple business lines.
        es: Lideré equipos que trabajan en planes de retiro y en un ecosistema crítico de pagos que procesa millones de dólares por día. Punto de escalamiento técnico para soluciones que abarcan microservicios, bases relacionales y no relacionales, procesos headless y varias líneas de negocio.
    - label: { en: Core-Satellite transformation, es: Transformación Core-Satellite }
      text:
        en: Took company-wide technical leadership for adopting decentralized, isolated testing environments based on IaaS concepts. Guided two early-adopter payment teams to develop and integrate about three months of changes without depending on the main branch.
        es: Asumí el liderazgo técnico a nivel compañía para adoptar ambientes de prueba descentralizados y aislados basados en conceptos de IaaS. Guié a dos equipos de pagos early adopters para desarrollar e integrar unos tres meses de cambios sin depender de la rama principal.
    - label: { en: Delivery alignment, es: Alineación de la entrega }
      text:
        en: Run design sessions with developers, Solutions Leads, product owners, and QA to define solution, rollout, and testing strategies, and present approaches in Communities of Practice for review by client SMEs, architects, and delivery leaders.
        es: Coordino sesiones de diseño con desarrolladores, Solutions Leads, product owners y QA para definir estrategias de solución, despliegue y pruebas, y presento los enfoques en Comunidades de Práctica para que los revisen SMEs, arquitectos y líderes de entrega del cliente.
    - label: { en: CI/CD enablement, es: Habilitación de CI/CD }
      text:
        en: Reverse-engineered and documented unfamiliar client CI/CD onboarding processes, trained the initial full-stack team, and shared the approach across the organization.
        es: Hice ingeniería inversa y documenté procesos de onboarding de CI/CD del cliente que nadie conocía bien, capacité al primer equipo full-stack y compartí el enfoque con toda la organización.
    - label: { en: People leadership, es: Liderazgo de personas }
      text:
        en: Lead development teams through hands-on technical guidance, coding support, training, coaching, and career development. For the past three years I’ve also coached Solutions Leads and junior Solutions Architects on role expectations, decision-making, and effective practices.
        es: Lidero equipos de desarrollo con guía técnica hands-on, soporte en código, capacitación, coaching y desarrollo de carrera. En los últimos tres años también acompañé a Solutions Leads y Solutions Architects junior en las expectativas del rol, la toma de decisiones y las buenas prácticas.

